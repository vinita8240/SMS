<div class="text-center py-16 px-4 rounded-2xl border-2 border-dashed border-slate-200 dark:border-slate-800 bg-white/50 dark:bg-slate-900/50">
  <div class="w-16 h-16 mx-auto mb-4 rounded-2xl bg-slate-100 dark:bg-slate-800 text-slate-400 flex items-center justify-center text-3xl">
    {{ icon }}
  </div>
  <h3 class="text-base font-bold text-slate-900 dark:text-white">{{ title }}</h3>
  <p class="text-sm text-slate-500 dark:text-slate-400 max-w-sm mx-auto mt-1 mb-6 leading-relaxed">
    {{ message }}
  </p>
  @if (actionText) {
    <button 
      (click)="action.emit()"
      class="inline-flex items-center space-x-2 px-5 py-2.5 rounded-xl text-sm font-semibold text-white bg-brand-600 hover:bg-brand-700 shadow-sm hover:shadow transition-all">
      <span>+</span>
      <span>{{ actionText }}</span>
    </button>
  }
</div>
