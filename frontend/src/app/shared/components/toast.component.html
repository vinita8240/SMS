<div class="fixed bottom-5 right-5 z-50 flex flex-col space-y-3 max-w-sm w-full pointer-events-none">
  @for (toast of notify.toasts(); track toast.id) {
    <div 
      class="pointer-events-auto flex items-start p-4 rounded-xl shadow-elevated border transition-all transform duration-300 animate-slide-in"
      [ngClass]="{
        'bg-white dark:bg-slate-900 border-emerald-500/30 text-emerald-950 dark:text-emerald-100': toast.type === 'success',
        'bg-white dark:bg-slate-900 border-rose-500/30 text-rose-950 dark:text-rose-100': toast.type === 'error',
        'bg-white dark:bg-slate-900 border-blue-500/30 text-blue-950 dark:text-blue-100': toast.type === 'info',
        'bg-white dark:bg-slate-900 border-amber-500/30 text-amber-950 dark:text-amber-100': toast.type === 'warning'
      }">
      
      <div class="mr-3 flex-shrink-0 mt-0.5">
        @if (toast.type === 'success') {
          <div class="w-6 h-6 rounded-full bg-emerald-100 dark:bg-emerald-950/60 text-emerald-600 dark:text-emerald-400 flex items-center justify-center font-bold text-xs">✓</div>
        } @else if (toast.type === 'error') {
          <div class="w-6 h-6 rounded-full bg-rose-100 dark:bg-rose-950/60 text-rose-600 dark:text-rose-400 flex items-center justify-center font-bold text-xs">✕</div>
        } @else if (toast.type === 'warning') {
          <div class="w-6 h-6 rounded-full bg-amber-100 dark:bg-amber-950/60 text-amber-600 dark:text-amber-400 flex items-center justify-center font-bold text-xs">!</div>
        } @else {
          <div class="w-6 h-6 rounded-full bg-blue-100 dark:bg-blue-950/60 text-blue-600 dark:text-blue-400 flex items-center justify-center font-bold text-xs">i</div>
        }
      </div>

      <div class="flex-1 min-w-0">
        <h4 class="text-sm font-semibold text-slate-800 dark:text-slate-100">{{ toast.title }}</h4>
        @if (toast.message) {
          <p class="text-xs mt-0.5 text-slate-600 dark:text-slate-300 leading-relaxed">{{ toast.message }}</p>
        }
      </div>

      <button 
        (click)="notify.remove(toast.id)"
        class="ml-2 text-slate-400 hover:text-slate-600 dark:hover:text-slate-200 transition-colors p-1">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
      </button>
    </div>
  }
</div>
