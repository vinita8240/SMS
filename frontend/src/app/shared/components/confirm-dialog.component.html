@if (isOpen) {
  <div class="fixed inset-0 z-50 overflow-y-auto" role="dialog" aria-modal="true">
    <div class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm transition-opacity"></div>
    <div class="flex min-h-full items-center justify-center p-4 text-center">
      <div class="relative transform overflow-hidden rounded-2xl bg-white dark:bg-slate-900 text-left shadow-2xl transition-all sm:my-8 w-full max-w-md border border-slate-200 dark:border-slate-800 p-6">
        
        <div class="flex items-center space-x-3 mb-4">
          <div class="w-10 h-10 rounded-full bg-rose-100 dark:bg-rose-950/60 text-rose-600 dark:text-rose-400 flex items-center justify-center text-xl font-bold">
            ⚠️
          </div>
          <h3 class="text-lg font-bold text-slate-900 dark:text-white">{{ title }}</h3>
        </div>

        <p class="text-sm text-slate-600 dark:text-slate-300 mb-6 leading-relaxed">
          {{ message }}
        </p>

        <div class="flex justify-end space-x-3">
          <button 
            type="button"
            (click)="cancel.emit()"
            class="px-4 py-2 rounded-xl text-sm font-medium text-slate-700 dark:text-slate-200 bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700 transition-colors">
            Cancel
          </button>
          <button 
            type="button"
            (click)="confirm.emit()"
            class="px-4 py-2 rounded-xl text-sm font-medium text-white bg-rose-600 hover:bg-rose-700 shadow-sm transition-colors">
            {{ confirmText }}
          </button>
        </div>

      </div>
    </div>
  </div>
}
