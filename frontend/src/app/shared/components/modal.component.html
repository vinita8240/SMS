@if (isOpen) {
  <div class="fixed inset-0 z-50 overflow-y-auto" role="dialog" aria-modal="true">
    <!-- Backdrop -->
    <div 
      (click)="closeOnBackdrop ? close.emit() : null" 
      class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm transition-opacity duration-300">
    </div>

    <div class="flex min-h-full items-center justify-center p-4 text-center sm:p-0">
      <div 
        class="relative transform overflow-hidden rounded-2xl bg-white dark:bg-slate-900 text-left shadow-2xl transition-all sm:my-8 w-full max-w-lg md:max-w-2xl lg:max-w-3xl border border-slate-200 dark:border-slate-800">
        
        <!-- Modal Header -->
        <div class="flex items-center justify-between border-b border-slate-100 dark:border-slate-800 px-6 py-4">
          <h3 class="text-lg font-bold text-slate-900 dark:text-white">{{ title }}</h3>
          <button 
            (click)="close.emit()"
            class="rounded-lg p-1.5 text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-800 hover:text-slate-600 dark:hover:text-slate-200 transition-colors">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
          </button>
        </div>

        <!-- Modal Content Body -->
        <div class="px-6 py-5 max-h-[75vh] overflow-y-auto">
          <ng-content></ng-content>
        </div>

      </div>
    </div>
  </div>
}
