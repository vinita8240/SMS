<div class="space-y-6">
      
      <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4">
        <div>
          <h1 class="text-2xl font-bold text-slate-800 dark:text-white flex items-center gap-2">
            <span>⚙️</span> Website & Institutional Settings
          </h1>
          <p class="text-xs text-slate-500 dark:text-slate-400 mt-1">
            Configure institutional profile, leadership messages, campus contact numbers, Google Maps location, and social links.
          </p>
        </div>

        <button (click)="saveSettings()" [disabled]="isSaving()" class="px-6 py-2.5 rounded-xl bg-[#705ec8] hover:bg-[#5d4cb0] text-white text-xs font-bold uppercase tracking-wider shadow-md transition flex items-center gap-1.5 self-start">
          <span>💾</span> {{ isSaving() ? 'Saving Changes...' : 'Save Settings' }}
        </button>
      </div>

      <div class="grid grid-cols-1 lg:grid-cols-12 gap-6">
        
        <!-- General Institutional Profile (8 cols) -->
        <div class="lg:col-span-8 bg-white dark:bg-slate-900 rounded-3xl shadow-sm border border-slate-200 dark:border-slate-800 p-6 sm:p-8 space-y-6">
          <h2 class="text-sm font-bold uppercase tracking-wider text-slate-400 border-b border-slate-100 dark:border-slate-800 pb-3">
            Institutional Brand & Header Info
          </h2>

          <div class="space-y-4 text-xs">
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
              <div>
                <label class="block font-bold uppercase text-slate-600 dark:text-slate-300 mb-1">School / College Name *</label>
                <input type="text" [(ngModel)]="formData.school_name" class="w-full px-3 py-2 rounded-lg border text-xs font-semibold" />
              </div>
              <div>
                <label class="block font-bold uppercase text-slate-600 dark:text-slate-300 mb-1">Brand Logo Image</label>
                <app-image-upload [(imageUrl)]="formData.school_logo" previewHeightClass="h-20"></app-image-upload>
              </div>
            </div>

            <div>
              <label class="block font-bold uppercase text-slate-600 dark:text-slate-300 mb-1">Motto / Tagline</label>
              <input type="text" [(ngModel)]="formData.tagline" class="w-full px-3 py-2 rounded-lg border text-xs" />
            </div>

            <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
              <div>
                <label class="block font-bold uppercase text-slate-600 dark:text-slate-300 mb-1">Official Telephone</label>
                <input type="text" [(ngModel)]="formData.phone" class="w-full px-3 py-2 rounded-lg border text-xs" />
              </div>
              <div>
                <label class="block font-bold uppercase text-slate-600 dark:text-slate-300 mb-1">Official Email</label>
                <input type="email" [(ngModel)]="formData.email" class="w-full px-3 py-2 rounded-lg border text-xs" />
              </div>
              <div>
                <label class="block font-bold uppercase text-slate-600 dark:text-slate-300 mb-1">Website URL</label>
                <input type="text" [(ngModel)]="formData.website" class="w-full px-3 py-2 rounded-lg border text-xs" />
              </div>
            </div>

            <div>
              <label class="block font-bold uppercase text-slate-600 dark:text-slate-300 mb-1">Campus Physical Address</label>
              <textarea [(ngModel)]="formData.address" rows="2" class="w-full px-3 py-2 rounded-lg border text-xs"></textarea>
            </div>

            <!-- Principal Section -->
            <div class="pt-4 border-t border-slate-100 dark:border-slate-800 space-y-4">
              <h3 class="text-xs font-bold uppercase tracking-wider text-slate-700 dark:text-slate-300">
                Principal / Head of Institution Desk
              </h3>
              
              <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <div>
                  <label class="block font-bold uppercase text-slate-500 mb-1">Principal Name</label>
                  <input type="text" [(ngModel)]="formData.principal_name" class="w-full px-3 py-2 rounded-lg border text-xs" />
                </div>
                <div>
                  <label class="block font-bold uppercase text-slate-500 mb-1">Official Title</label>
                  <input type="text" [(ngModel)]="formData.principal_title" class="w-full px-3 py-2 rounded-lg border text-xs" />
                </div>
              </div>

              <div>
                <label class="block font-bold uppercase text-slate-500 mb-1">Principal Message</label>
                <textarea [(ngModel)]="formData.principal_message" rows="3" class="w-full px-3 py-2 rounded-lg border text-xs"></textarea>
              </div>

              <div>
                <label class="block font-bold uppercase text-slate-500 mb-1">Principal Portrait</label>
                <app-image-upload [(imageUrl)]="formData.principal_image" previewHeightClass="h-24"></app-image-upload>
              </div>
            </div>
          </div>
        </div>

        <!-- Footer & Social Media (4 cols) -->
        <div class="lg:col-span-4 space-y-6">
          
          <div class="bg-white dark:bg-slate-900 rounded-3xl shadow-sm border border-slate-200 dark:border-slate-800 p-6 space-y-4 text-xs">
            <h3 class="font-bold uppercase tracking-wider text-slate-400 border-b pb-2">Footer & Copyright</h3>
            
            <div>
              <label class="block font-bold uppercase text-slate-600 mb-1">Footer About Text</label>
              <textarea [(ngModel)]="formData.footer_text" rows="3" class="w-full px-3 py-2 rounded-lg border text-xs"></textarea>
            </div>

            <div>
              <label class="block font-bold uppercase text-slate-600 mb-1">Copyright Notice</label>
              <input type="text" [(ngModel)]="formData.copyright_text" class="w-full px-3 py-2 rounded-lg border text-xs" />
            </div>

            <div class="pt-2">
              <label class="flex items-center space-x-2 cursor-pointer">
                <input type="checkbox" [(ngModel)]="formData.admissions_open" [checked]="formData.admissions_open === 1" (change)="formData.admissions_open = formData.admissions_open ? 1 : 0" class="rounded" />
                <span class="font-bold text-slate-700 dark:text-slate-200">Admissions Active Indicator</span>
              </label>
            </div>
          </div>

          <div class="bg-white dark:bg-slate-900 rounded-3xl shadow-sm border border-slate-200 dark:border-slate-800 p-6 space-y-3 text-xs">
            <h3 class="font-bold uppercase tracking-wider text-slate-400 border-b pb-2">Social Channels</h3>
            
            <div>
              <label class="block text-[10px] font-bold uppercase text-slate-500">Facebook URL</label>
              <input type="text" [(ngModel)]="socialLinks.facebook" class="w-full px-2.5 py-1.5 rounded border text-xs font-mono" />
            </div>

            <div>
              <label class="block text-[10px] font-bold uppercase text-slate-500">Twitter / X URL</label>
              <input type="text" [(ngModel)]="socialLinks.twitter" class="w-full px-2.5 py-1.5 rounded border text-xs font-mono" />
            </div>

            <div>
              <label class="block text-[10px] font-bold uppercase text-slate-500">Instagram URL</label>
              <input type="text" [(ngModel)]="socialLinks.instagram" class="w-full px-2.5 py-1.5 rounded border text-xs font-mono" />
            </div>

            <div>
              <label class="block text-[10px] font-bold uppercase text-slate-500">LinkedIn URL</label>
              <input type="text" [(ngModel)]="socialLinks.linkedin" class="w-full px-2.5 py-1.5 rounded border text-xs font-mono" />
            </div>
          </div>

        </div>

      </div>

    </div>
