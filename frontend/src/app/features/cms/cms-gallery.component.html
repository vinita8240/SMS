<div class="space-y-6">
      
      <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4">
        <div>
          <h1 class="text-2xl font-bold text-slate-800 dark:text-white flex items-center gap-2">
            <span>📸</span> Campus Media Gallery
          </h1>
          <p class="text-xs text-slate-500 dark:text-slate-400 mt-1">
            Organize campus photography albums, laboratory showcases, sports competitions, and cultural galas.
          </p>
        </div>

        <button (click)="openCreateModal()" class="px-5 py-2.5 rounded-xl bg-[#705ec8] hover:bg-[#5d4cb0] text-white text-xs font-bold uppercase tracking-wider shadow-md transition flex items-center gap-1.5 self-start">
          <span>+</span> Upload Photo Item
        </button>
      </div>

      <!-- Gallery Grid -->
      <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6">
        <div *ngFor="let item of items()" class="bg-white dark:bg-slate-900 rounded-2xl shadow-sm border border-slate-200 dark:border-slate-800 overflow-hidden flex flex-col justify-between group">
          <div>
            <div class="h-44 bg-slate-100 dark:bg-slate-800 relative overflow-hidden">
              <img [src]="item.image_url" [alt]="item.title" class="w-full h-full object-cover group-hover:scale-105 transition duration-500" />
              <span *ngIf="item.category_name" class="absolute top-3 left-3 px-2 py-0.5 rounded text-[10px] font-bold bg-black/60 text-white uppercase backdrop-blur-xs">
                {{ item.category_name }}
              </span>
            </div>
            <div class="p-4 space-y-1">
              <h3 class="font-bold text-xs text-slate-800 dark:text-white line-clamp-1">{{ item.title }}</h3>
              <p *ngIf="item.description" class="text-[11px] text-slate-500 line-clamp-1">{{ item.description }}</p>
            </div>
          </div>
          <div class="p-4 pt-0 flex justify-end space-x-2 border-t border-slate-100 dark:border-slate-800/60 pt-2">
            <button (click)="deleteItem(item)" class="text-xs text-rose-600 font-bold hover:underline">Delete</button>
          </div>
        </div>
      </div>

      <!-- Modal -->
      <div *ngIf="isModalOpen()" class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/60 backdrop-blur-xs animate-in fade-in">
        <div class="bg-white dark:bg-slate-900 rounded-3xl shadow-2xl border border-slate-200 dark:border-slate-800 w-full max-w-md p-6 sm:p-8 space-y-4">
          <div class="flex items-center justify-between border-b pb-3">
            <h3 class="font-bold text-sm text-slate-800 dark:text-white">Add Photo to Gallery</h3>
            <button (click)="isModalOpen.set(false)" class="text-slate-400 text-lg font-bold">✕</button>
          </div>

          <form (ngSubmit)="saveItem()" class="space-y-3 text-xs">
            <div>
              <label class="block font-bold uppercase text-slate-600 mb-1">Photo Title *</label>
              <input type="text" [(ngModel)]="formData.title" name="title" required class="w-full px-3 py-2 rounded-lg border text-xs" placeholder="e.g. Science Lab Experiment" />
            </div>

            <div>
              <label class="block font-bold uppercase text-slate-600 mb-1">Upload Photo *</label>
              <app-image-upload [(imageUrl)]="formData.image_url" previewHeightClass="h-40"></app-image-upload>
            </div>

            <div>
              <label class="block font-bold uppercase text-slate-600 mb-1">Category Album</label>
              <select [(ngModel)]="formData.category_id" name="category_id" class="w-full px-3 py-2 rounded-lg border text-xs">
                <option *ngFor="let cat of categories()" [ngValue]="cat.category_id">{{ cat.name }}</option>
              </select>
            </div>

            <div>
              <label class="block font-bold uppercase text-slate-600 mb-1">Caption Description</label>
              <input type="text" [(ngModel)]="formData.description" name="description" class="w-full px-3 py-2 rounded-lg border text-xs" />
            </div>

            <div class="pt-4 border-t flex justify-end space-x-3">
              <button type="button" (click)="isModalOpen.set(false)" class="px-4 py-2 rounded-xl text-xs font-bold text-slate-600">Cancel</button>
              <button type="submit" class="px-6 py-2 rounded-xl bg-[#705ec8] text-white font-bold text-xs uppercase shadow-md">Add Photo</button>
            </div>
          </form>
        </div>
      </div>

    </div>
