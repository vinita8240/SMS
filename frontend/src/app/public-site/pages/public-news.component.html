<div class="min-h-screen bg-slate-50 font-sans pb-20">
      
      <!-- Top Navigation -->
      <div class="bg-white border-b border-slate-200 sticky top-10 z-30 shadow-xs">
        <div class="max-w-6xl mx-auto px-4 sm:px-8 h-16 flex items-center justify-between">
          <a routerLink="/site" class="text-xs font-bold text-indigo-600 hover:text-indigo-800 transition uppercase">
            <span>←</span> Back to Homepage
          </a>
          <span class="text-xs font-bold text-slate-800">News & Bulletins</span>
        </div>
      </div>

      <div class="bg-slate-900 text-white py-14 px-4 sm:px-8 text-center space-y-2">
        <h1 class="text-3xl sm:text-4xl font-black">Campus News & Media Dispatches</h1>
        <p class="text-xs sm:text-sm text-slate-300">Stay updated with academic achievements, milestones, and student celebrations</p>
      </div>

      <div class="max-w-6xl mx-auto px-4 sm:px-8 mt-10">
        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">
          <div *ngFor="let item of news()" class="bg-white rounded-2xl shadow-md border border-slate-200 overflow-hidden flex flex-col justify-between hover:shadow-xl transition group">
            <div>
              <div class="h-48 overflow-hidden relative">
                <img [src]="item.image_url" [alt]="item.title" class="w-full h-full object-cover transition-transform duration-500 group-hover:scale-105" />
                <span class="absolute top-3 left-3 px-2.5 py-1 rounded-full text-[10px] font-bold bg-white/90 text-indigo-900 uppercase shadow-xs">
                  {{ item.category }}
                </span>
              </div>
              <div class="p-6 space-y-2">
                <div class="text-[11px] text-slate-400 font-semibold">📅 {{ item.published_at }}</div>
                <h2 class="font-bold text-base text-slate-800 group-hover:text-indigo-600 transition leading-snug">{{ item.title }}</h2>
                <p class="text-xs text-slate-600 leading-relaxed line-clamp-3">{{ item.summary }}</p>
              </div>
            </div>
            <div class="px-6 pb-6 pt-2 border-t border-slate-50">
              <a [routerLink]="['/site/p', item.slug]" class="text-xs font-bold text-indigo-600 hover:underline uppercase tracking-wider">
                Read Full Story →
              </a>
            </div>
          </div>
        </div>
      </div>

    </div>
