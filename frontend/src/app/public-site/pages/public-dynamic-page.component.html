<div class="min-h-screen bg-slate-50 font-sans pb-20">
      
      <!-- Top Navigation Bar for Single Pages -->
      <div class="bg-white border-b border-slate-200 sticky top-10 z-30 shadow-xs">
        <div class="max-w-6xl mx-auto px-4 sm:px-8 h-16 flex items-center justify-between">
          <a routerLink="/site" class="flex items-center space-x-2 text-xs font-bold text-indigo-600 hover:text-indigo-800 transition uppercase">
            <span>←</span> Back to Homepage
          </a>
          <div class="flex items-center space-x-3 text-xs text-slate-500">
            <a routerLink="/site" class="hover:underline">Home</a>
            <span>/</span>
            <span class="font-bold text-slate-800">{{ page()?.title || 'Page' }}</span>
          </div>
        </div>
      </div>

      <!-- Hero Header Banner -->
      <div class="bg-gradient-to-r from-slate-900 via-indigo-950 to-slate-900 text-white py-16 px-4 sm:px-8">
        <div class="max-w-4xl mx-auto space-y-3">
          <h1 class="text-3xl sm:text-4xl lg:text-5xl font-black tracking-tight text-white">
            {{ page()?.title }}
          </h1>
          <p *ngIf="page()?.subtitle" class="text-base sm:text-lg text-slate-300 font-normal">
            {{ page()?.subtitle }}
          </p>
        </div>
      </div>

      <!-- Page Body Container -->
      <div class="max-w-7xl mx-auto px-4 sm:px-8 -mt-6">
        <div class="bg-white rounded-2xl shadow-xl border border-slate-200 overflow-hidden p-8 sm:p-12 space-y-8">
          
          <!-- Featured Image if available -->
          <div *ngIf="page()?.featured_image" class="h-72 sm:h-96 rounded-xl overflow-hidden shadow-md">
            <img [src]="page()?.featured_image" [alt]="page()?.title" class="w-full h-full object-cover" />
          </div>

          <!-- Rich HTML Content -->
          <div class="prose prose-slate max-w-none prose-headings:font-bold prose-h2:text-2xl prose-h3:text-xl prose-p:leading-relaxed prose-li:text-slate-700 text-slate-700 text-sm sm:text-base leading-relaxed" 
               [innerHTML]="page()?.content">
          </div>

          <!-- Bottom Action -->
          <div class="pt-8 border-t border-slate-100 flex flex-wrap items-center justify-between gap-4">
            <a routerLink="/site" class="px-5 py-2.5 rounded-lg bg-slate-100 hover:bg-slate-200 text-slate-800 text-xs font-bold uppercase transition">
              ← Return to Main Page
            </a>
            <a routerLink="/site/contact" class="px-6 py-2.5 rounded-lg bg-[#705ec8] hover:bg-indigo-700 text-white text-xs font-bold uppercase tracking-wider transition shadow-sm">
              Inquire About Admissions
            </a>
          </div>

        </div>
      </div>

    </div>
